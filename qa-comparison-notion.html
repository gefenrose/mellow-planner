<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mellow Notion visual QA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e9e9e7;color:#202020;font:14px Inter,system-ui,sans-serif}
    main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px;min-width:1200px}
    figure{margin:0;padding:12px;background:#fff;border:1px solid #d9d9d6;border-radius:8px}
    figcaption{margin:0 0 10px;font-weight:700}img{display:block;width:100%;height:auto;border:1px solid #ececea}
  </style>
</head>
<body>
  <main>
    <figure><figcaption>Selected direction — Notion database planner, no global toolbar</figcaption><img src="./qa-source-notion-option-2.png" alt="Selected Notion-style source direction"></figure>
    <figure><figcaption>Implemented Mellow — Hebrew desktop, 1440 × 1024</figcaption><img src="./qa-implementation-notion-v66.png" alt="Implemented Mellow desktop view"></figure>
  </main>
</body>
</html>
